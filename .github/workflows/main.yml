
name: Build Kolonka Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KolonkaControl-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
